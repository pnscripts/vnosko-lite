name: CI

# Every push to main and every pull request: the tests, the buyer check (what
# npm hands a user: npm pack, a fresh project installs the tarball, then ESM
# and CommonJS read real files) and the audit of the build tools.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung step (network, installer) stops here, not after GitHub's 6 hours.
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit hashes, so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not kept in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The package has no dependencies; esbuild is the only build tool.
      - name: npm audit
        run: npm audit --audit-level=moderate
      - name: Tests
        run: npm test
      # npm pack runs the build (prepack), so this also checks dist/.
      - name: Buyer check
        run: bash tools/buyer_check.sh
